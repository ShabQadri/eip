[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entertainment-intelligence-platform"
version = "0.1.0"
description = "A Telegram-based movie and TV entertainment digest system"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "feedparser>=6.0.10",
    "rapidfuzz>=3.0.0",
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "W", "I"]
ignore = []
